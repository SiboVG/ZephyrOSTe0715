# West manifest for the TE0715 Zephyr application.
# Pins Zephyr and only pulls in the modules this app needs.

manifest:
  self:
    path: app

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: sibovg
      url-base: https://github.com/SiboVG
    - name: spaceinventor
      url-base: https://github.com/spaceinventor
    - name: nasa
      url-base: https://github.com/nasa
    - name: fprime-community
      url-base: https://github.com/fprime-community

  projects:
    # Zephyr v4.4.2 plus (branch te0715-can-v4.4.2 in the SiboVG fork):
    # - the uart_xlnx_ps fixes of zephyrproject-rtos/zephyr#119996
    # - the Zynq-7000 PS CAN driver (upstream branch: xlnx-can, based on main)
    # Switch back to remote zephyrproject-rtos and a release tag once both
    # are released. A release with fd9cd01ef774 (Ethernet MDIO/PHY drivers)
    # also lets patch zephyr/0002 go; see docs/architecture/dependencies.md.
    - name: zephyr
      remote: sibovg
      revision: 70b56a29cd748ee70924defea39f60f9f2ecbf70
      import:
        name-allowlist:
          - cmsis
          - cmsis_6

    # Space Inventor libcsp, the csh/2.10 release matched with libparam
    - name: libcsp
      remote: spaceinventor
      revision: 5a95e5c48826c3602bf4a34aa5d60e2af9e4a004
      path: modules/lib/libcsp

    # Space Inventor libparam, the csh/2.10 release matched with libcsp.
    # Built by the zephyr/ directory of this repository (CONFIG_LIBPARAM).
    - name: libparam
      remote: spaceinventor
      revision: d78da56e7cbc8b6be30d8890b6f01cdf80d0b9b9
      path: modules/lib/libparam

    # F Prime at the revision pinned by fprime-csp-libparam, and the last
    # fprime-zephyr revision that supports it (later ones need nasa/fprime#5615)
    - name: fprime
      remote: nasa
      revision: 35d4c0e881482adf372b8eee3eb56ad2dee74618
      path: modules/fprime/fprime
    - name: fprime-zephyr
      remote: fprime-community
      revision: 6e2a4111a94be0278d8096d71a50cc7b6bbdba70
      path: modules/fprime/fprime-zephyr
