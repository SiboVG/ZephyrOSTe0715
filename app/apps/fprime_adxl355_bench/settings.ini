; F Prime project for the ADXL355 bench on the TE0715 (Zephyr). Paths assume the
; workspace layout: fprime-adxl355 checked out next to this west workspace.
[fprime]
framework_path: ../../../modules/fprime/fprime
project_root: .
library_locations: ../../../modules/fprime/fprime-zephyr:../../fprime-bench:../../../../fprime-adxl355
default_toolchain: zephyr
default_cmake_options: BOARD=te0715
    FPRIME_ENABLE_FRAMEWORK_UTS=OFF
    FPRIME_ENABLE_AUTOCODER_UTS=OFF
