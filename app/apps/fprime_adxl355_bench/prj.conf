# F Prime (as apps/fprime_csp_bench, from fprime-zephyr sample-config)
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP17=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=n
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_KERNEL_MEM_POOL=y
CONFIG_REBOOT=y
CONFIG_RING_BUFFER=y
CONFIG_ASSERT=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_FILE_SYSTEM=y
# Every thread stack must be exactly this size (Top/instances.fpp STACK_SIZE)
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=16384
# Active components (cmdDisp, textLogger, tlmPrinter) and spares
CONFIG_DYNAMIC_THREAD_POOL_SIZE=6
# F Prime priority p runs at Zephyr priority 99 - p (patch 0003 of fprime-zephyr)
CONFIG_NUM_PREEMPT_PRIORITIES=100

# SPI1 on Pmod J1 (app/boards/te0701-spi1.overlay); GPIO for its chip select
CONFIG_SPI=y
CONFIG_GPIO=y

# Console; floating point in printk and the shell for readings
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Serial shell: the adxl commands and Zephyr's kernel diagnostics
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# The adxl commands run the device manager on the shell thread
CONFIG_SHELL_STACK_SIZE=16384
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# Timeouts in 50 us steps, so every ADXL355 output data rate (4 kHz down to 3.906 Hz)
# is a whole number of ticks for the frame timer (the kernel is tickless)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=20000

# One console line at a time: without time slicing, threads of equal priority never
# cut into each other's lines (a 150-character line takes 13 ms at 115200 baud, a
# time slice 20 ms), and a polled shell writes its lines synchronously like printk.
# The console printers run at the shell's priority (Top/instances.fpp).
CONFIG_TIMESLICING=n
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=n
