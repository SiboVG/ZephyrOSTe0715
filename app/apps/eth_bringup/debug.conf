# Diagnosis of a boot that stops early:
#   west build -b te0715 app/apps/eth_bringup -d build/eth_debug -- -DEXTRA_CONF_FILE=debug.conf
CONFIG_APP_BOOT_TRACE=y
# Log messages printed when they happen, also from driver initialization and faults
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ETHERNET_LOG_LEVEL_DBG=y
# printk straight to the console, also before the log backend starts (PRE_KERNEL_2)
CONFIG_LOG_PRINTK=n
