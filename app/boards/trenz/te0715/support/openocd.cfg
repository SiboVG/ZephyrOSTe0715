# OpenOCD for the TE0715 on a TE0701, through the TE0701's Digilent JTAG/UART
# cable (FT2232H: JTAG on channel A, the console UART on channel B). For a host
# without AMD xsdb, e.g. to reset the board:
#
#   openocd -f app/boards/trenz/te0715/support/openocd.cfg -c "init; te0715_reset; shutdown"
#
# OpenOCD from the Zephyr SDK works (hosttools). The cable's USB device needs
# write access, see docs/guide/boot.md.

adapter driver ftdi
ftdi device_desc "Digilent USB Device"
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0088 0x008b
reset_config none
transport select jtag
adapter speed 1000

# Zynq-7000 chain: the PL's TAP (XC7Z030), then the PS's ARM debug access port
jtag newtap zynq_pl bs -irlen 6 -ircapture 0x1 -irmask 0x03 -expected-id 0x1372c093
jtag newtap zynq cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477
dap create zynq.dap -chain-position zynq.cpu

# System bus access through the DAP's AHB access port, without halting a CPU
target create zynq.ahb mem_ap -dap zynq.dap -ap-num 0

# Reset the whole processing system as sys_reboot() does (board.c): unlock the
# SLCR, then PSS_RST_CTRL.SOFT_RST (Zynq-7000 TRM, appendix B.28). The board
# then boots from its SD card.
proc te0715_reset {} {
	zynq.ahb mww 0xF8000008 0xDF0D
	zynq.ahb mww 0xF8000200 0x1
}
