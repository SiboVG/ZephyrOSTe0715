# SPDX-License-Identifier: Apache-2.0
#
# Load a Zephyr ELF into DDR on the TE0715 over JTAG (used by `west flash`).
#
#   xsdb xsdb.cfg <zephyr.elf> [<bitstream.bit> | - [sd-state]]
#
# The PS is initialised with support/ps7_init.tcl, exported from the Trenz
# test_board reference design (Vivado 2022.2, variant 04_30_1i_1gb, xc7z030).
# It sets up clocks, DDR and the MIO pin muxing (including GPIO on MIO7/MIO9).
# Set HW_SERVER_URL to use a remote hw_server.
#
# sd-state leaves the CPU as U-Boot does on an SD boot: L2 cache enabled and
# ACTLR = 0x41 (SMP, FW). After `rst -processor` both are off, and with
# ACTLR.SMP clear the Cortex-A9 does not cache Shareable memory, so the image
# runs 3 to 10 times slower than from the SD card (docs/known-issues.md). Use
# it for timing measurements; "-" in place of the bitstream loads none.

set script_dir [file dirname [file normalize [info script]]]

if { $argc < 1 } {
	puts "usage: xsdb xsdb.cfg <zephyr.elf> \[<bitstream.bit> | - \[sd-state\]\]"
	exit 1
}
set elf_file [lindex $argv 0]
set bit_file [lindex $argv 1]
if { $bit_file eq "-" } {
	set bit_file ""
}
set sd_state [expr { [lindex $argv 2] eq "sd-state" }]

if { [info exists ::env(HW_SERVER_URL)] } {
	connect -url $::env(HW_SERVER_URL)
} else {
	connect
}

# Reset the whole system. The board then starts booting from its boot
# medium, so halt the CPU again before initialising the PS.
targets -set -nocase -filter {name =~ "APU*"}
rst -system
after 1000

targets -set -nocase -filter {name =~ "*A9*#0"}
rst -processor

if { [string length $bit_file] != 0 } {
	fpga -file $bit_file
}

source [file join $script_dir ps7_init.tcl]
ps7_init
ps7_post_config

if { $sd_state } {
	# Invalidate every L2 way, then enable the controller
	mwr -force 0xF8F0277C 0xFFFF
	while { [mrd -force -value 0xF8F0277C] & 0xFFFF } {
		after 1
	}
	mwr -force 0xF8F02100 1
	rwr cp15 c1 actlr 0x41
	puts "sd-state: L2_CONTROL [format 0x%08X [mrd -force -value 0xF8F02100]], [lindex [split [rrd cp15 c1] \n] 0]"
}

dow $elf_file
con
disconnect
