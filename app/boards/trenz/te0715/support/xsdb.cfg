#
# Load a Zephyr ELF into DDR on the TE0715 over JTAG (used by `west flash`).
#
#   xsdb xsdb.cfg <zephyr.elf> [<bitstream.bit>]
#
# The PS is initialised with support/ps7_init.tcl, exported from the Trenz
# test_board reference design (Vivado 2022.2, variant 04_30_1i_1gb, xc7z030).
# It sets up clocks, DDR and the MIO pin muxing (including GPIO on MIO7/MIO9).
# Set HW_SERVER_URL to use a remote hw_server.

set script_dir [file dirname [file normalize [info script]]]

if { $argc < 1 } {
	puts "usage: xsdb xsdb.cfg <zephyr.elf> \[<bitstream.bit>\]"
	exit 1
}
set elf_file [lindex $argv 0]
set bit_file [lindex $argv 1]

if { [info exists ::env(HW_SERVER_URL)] } {
	connect -url $::env(HW_SERVER_URL)
} else {
	connect
}

# Reset the whole system. The board then starts booting from its boot
# medium, so halt the CPU again before initialising the PS.
targets -set -nocase -filter {name =~ "APU*"}
rst -system
after 1000

targets -set -nocase -filter {name =~ "*A9*#0"}
rst -processor

if { [string length $bit_file] != 0 } {
	fpga -file $bit_file
}

source [file join $script_dir ps7_init.tcl]
ps7_init
ps7_post_config

dow $elf_file
con
disconnect
