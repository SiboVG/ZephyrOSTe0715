patches:
  - path: libcsp/0001-zephyr-include-time.h-from-the-C-library.patch
    sha256sum: 4ffa5182402caeaefc11a3a6c30eeb81eca9b7cfb9d6328ec127be2d5ae52df5
    module: libcsp
    author: Sibo Van Gool
    email: sibo.vangool@hotmail.com
    date: 2026-09-22
    upstreamable: true
    comments: |
      Zephyr 4.x removed <zephyr/posix/time.h>; the POSIX clock functions
      are declared by the C library's <time.h>.
  - path: libcsp/0002-zephyr-can-do-not-block-forever-on-unacknowledged-frames.patch
    sha256sum: 1bdbdb9deca9044c6312801cafd832a191ca721b68e1bc6fe6d7777cdc8291b1
    module: libcsp
    author: Sibo Van Gool
    email: sibo.vangool@hotmail.com
    date: 2026-09-24
    upstreamable: true
    comments: |
      can_zephyr.c called can_send() without a callback, which makes Zephyr
      wait with K_FOREVER until the frame is sent. With no node acknowledging
      (bus disconnected, or all other nodes off) the controller retransmits
      forever and every CSP sender blocks. Pass a completion callback, so a
      send waits at most CSP_CAN_TX_TIME_OUT (100 ms) for a free TX buffer and
      otherwise fails with -EAGAIN; CSP then drops the packet. Also present
      on upstream develop (e14f5ec3, 2026-09-09).
  - path: libparam/0001-vmem-client-do-not-shadow-abort.patch
    sha256sum: c31f0e48e587a22d0fdc36a74dd9471ab0492b92a1091a6b0dd9578711166f01
    module: modules/lib/libparam
    author: Sibo Van Gool
    email: sibo.vangool@hotmail.com
    date: 2026-09-22
    upstreamable: true
    comments: |
      vmem_client.c declares a file-scope variable named abort, which
      conflicts with abort() from <stdlib.h> in the Zephyr (picolibc) build.
  - path: fprime-zephyr/0001-lora-enum-command-handler-signature.patch
    sha256sum: 8750e54a90b8b10f5a4a5c855659c3856e3f6c88c3c81200c042b61842bf5ee7
    module: modules/fprime/fprime-zephyr
    author: Sibo Van Gool
    email: sibo.vangool@hotmail.com
    date: 2026-09-22
    upstreamable: false
    merge-pr: https://github.com/fprime-community/fprime-zephyr/pull/64
    comments: |
      LoRa part of fprime-zephyr b76db2b: the pinned F Prime already passes
      enum command arguments by const reference.
  - path: fprime-zephyr/0002-os-task-default-stack-size.patch
    sha256sum: 52da6aecbe4ffa93c4d6c27d00ae4ef776d09c9f70ae4176553ea39f09ebfecf
    module: modules/fprime/fprime-zephyr
    author: Sibo Van Gool
    email: sibo.vangool@hotmail.com
    date: 2026-09-22
    upstreamable: true
    comments: |
      Os::Task::TASK_DEFAULT as stack size was passed to k_thread_stack_alloc()
      as SIZE_MAX, so every task started with default arguments failed. Use
      CONFIG_DYNAMIC_THREAD_STACK_SIZE, and fix the priority warning format.
  - path: fprime-zephyr/0003-os-task-map-fprime-priorities.patch
    sha256sum: 2e52c30a587d7def76b831bca84b4a088915323d6e4d8eb4d3b29a6199c4d9b3
    module: modules/fprime/fprime-zephyr
    author: Sibo Van Gool
    email: sibo.vangool@hotmail.com
    date: 2026-09-23
    upstreamable: true
    comments: |
      F Prime priorities (higher value = higher priority) were passed to Zephyr
      unchanged (lower value = higher priority) and every value above 14 was
      clamped to 14, so all F Prime tasks ran at the lowest priority. Map p to
      CONFIG_NUM_PREEMPT_PRIORITIES - 1 - p, keeping order and spacing.
