# West manifest for the TE0715 Zephyr application.
# Pins Zephyr and only pulls in the modules this app needs.

manifest:
  self:
    path: app

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: sibovg
      url-base: https://github.com/SiboVG
    - name: spaceinventor
      url-base: https://github.com/spaceinventor

  projects:
    # Zephyr v4.4.2 plus the uart_xlnx_ps driver fixes from
    # https://github.com/zephyrproject-rtos/zephyr/pull/119996
    # (branch xuartps-fixes-v4.4.2 in the SiboVG fork). Switch back to
    # remote zephyrproject-rtos and a release tag once those fixes are released.
    - name: zephyr
      remote: sibovg
      revision: 8ad6ae61020402ce08b1db028bafd596615203cf
      import:
        name-allowlist:
          - cmsis
          - cmsis_6

    # Space Inventor libcsp, the csh/2.10 release matched with libparam
    - name: libcsp
      remote: spaceinventor
      revision: 5a95e5c48826c3602bf4a34aa5d60e2af9e4a004
      path: modules/lib/libcsp
