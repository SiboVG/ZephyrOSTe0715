# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: TE0715 Zephyr, CAN and F Prime bring-up
site_description: Zephyr board support, Zynq CAN driver, libcsp/libparam and F Prime on the Trenz TE0715, with test procedures and results
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.path
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Hardware setup: hardware-setup.md
  - Drivers and patches: drivers.md
  - Tests:
      - Overview: tests/index.md
      - Zephyr test suites: tests/zephyr-suites.md
      - CAN bus: tests/can-bus.md
      - CSP, libparam and F Prime: tests/csp-libparam-fprime.md
      - Results: tests/results.md
  - SD card boot: sd-card-boot.md
  - FlatSat from macOS: flatsat.md
  - Known issues: known-issues.md
