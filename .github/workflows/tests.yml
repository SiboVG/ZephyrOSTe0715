# Unit tests and build checks that need no hardware. The hardware tests
# (app/scripts/collect_results.sh) run on the bench; see docs/tests/.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Host scripts (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyserial pexpect
      - run: python -m pytest -v app/tests/scripts

  ztest:
    name: Firmware unit tests (ztest, native_sim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/zephyr-workspace
      - name: Run twister
        env:
          # native_sim builds with the host's gcc; no Zephyr SDK needed
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          zephyr/scripts/twister -T app/tests -p native_sim/native/64 \
            --inline-logs -v -O twister-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-native_sim
          path: |
            twister-out/twister.json
            twister-out/**/handler.log
            twister-out/**/build.log
          if-no-files-found: ignore

  build:
    name: Build for the TE0715
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/zephyr-workspace
        with:
          # everything but F Prime (about 700 MB), which is not built here
          project-filter: "-fprime.*"
          sdk: true
      - name: Build the applications
        run: |
          west build -b te0715 app -d build/demo
          west build -b te0715 app/apps/can_bringup -d build/can_bringup
          west build -b te0715 app/apps/eth_bringup -d build/eth_bringup
          west build -b te0715 app/apps/eth_bringup -d build/eth_bringup-debug -- -DEXTRA_CONF_FILE=debug.conf
          west build -b te0715 app/apps/csp_node -d build/csp_node
          # SPI1 on Pmod J1 (board support of the sensor benches, whose F Prime
          # applications are not built here)
          west build -b te0715 app -d build/demo-spi1 -- \
            -DEXTRA_DTC_OVERLAY_FILE=$PWD/app/boards/te0701-spi1.overlay -DCONFIG_SPI=y
          # the unit tests' build, for the static analysis of the parsers they
          # share with the F Prime CSP bench (bench_value.c, bench_config.c)
          west build -b te0715 app/tests/bench -d build/bench
      - name: Build the unit tests for the board
        run: zephyr/scripts/twister -T app/tests -p te0715 --build-only -v -O twister-te0715
      # Static analysis gate (cppcheck + clang-tidy, zero findings) on the
      # builds above; see docs/getting-started/static-analysis.md
      - name: Cache cppcheck
        uses: actions/cache@v6
        with:
          path: ~/.local/cppcheck-2.22.0
          key: cppcheck-2.22.0-${{ runner.os }}-${{ runner.arch }}
      - name: Static analysis tools
        run: |
          sh app/scripts/install-cppcheck.sh
          echo "$HOME/.local/cppcheck-2.22.0/bin" >> "$GITHUB_PATH"
          pipx install clang-tidy==22.1.8
      - name: Static analysis (cppcheck + clang-tidy)
        run: python3 app/scripts/static_analysis.py --no-configure --report static-analysis-report.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-report
          path: static-analysis-report.txt
          if-no-files-found: ignore
