CONFIG_CAN=y
CONFIG_LIBCSP=y
# Needed by the POSIX timer options libcsp selects
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_CSP_HAVE_CAN=y
CONFIG_CSP_CAN_RX_THREAD_STACK_SIZE=2048
# The libcsp Zephyr CAN interface allocates its context from the system heap
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_PICOLIBC=y
CONFIG_EVENTS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LIBPARAM=y
# The dynamic libparam list allocates with malloc()
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384
