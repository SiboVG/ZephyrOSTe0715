# F Prime (from fprime-zephyr sample-config)
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP17=y
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=n
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_KERNEL_MEM_POOL=y
CONFIG_REBOOT=y
CONFIG_RING_BUFFER=y
CONFIG_ASSERT=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
CONFIG_FILE_SYSTEM=y
# Every thread stack must be exactly this size (Top/instances.fpp STACK_SIZE)
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=16384
# Active components, the libcsp router task and spares
CONFIG_DYNAMIC_THREAD_POOL_SIZE=8
# F Prime priority p runs at Zephyr priority 99 - p (patch 0003 of fprime-zephyr),
# so F Prime priorities 0..99 keep their order and spacing
CONFIG_NUM_PREEMPT_PRIORITIES=100

# CAN, libcsp and libparam
CONFIG_CAN=y
CONFIG_LIBCSP=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_CSP_HAVE_CAN=y
CONFIG_CSP_CAN_RX_THREAD_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_EVENTS=y
CONFIG_LIBPARAM=y

# Console
CONFIG_PRINTK=y
CONFIG_LOG=y
# Synchronous console output, so messages printed just before a crash are not lost
CONFIG_LOG_MODE_IMMEDIATE=y


# Serial shell: bench/csp/param commands, and Zephyr's kernel and CAN diagnostics
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=8192
# Logs and printk straight to the UART, also before the shell is up
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_KERNEL_SHELL=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_CAN_SHELL=y
CONFIG_CAN_STATS=y
CONFIG_STATS=y
