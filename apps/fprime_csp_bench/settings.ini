; F Prime project for the CSP/libparam bench server on the TE0715 (Zephyr).
; Paths assume the Sandbox layout: this workspace next to the
; fprime-csp-libparam and CspLibparamFprimeTest checkouts.
[fprime]
framework_path: ../../../modules/fprime/fprime
project_root: .
library_locations: ../../../modules/fprime/fprime-zephyr:../../../../fprime-csp-libparam:../../../../CspLibparamFprimeTest
default_toolchain: zephyr
default_cmake_options: BOARD=te0715
    FPRIME_ENABLE_FRAMEWORK_UTS=OFF
    FPRIME_ENABLE_AUTOCODER_UTS=OFF
